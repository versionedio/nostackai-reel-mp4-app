# Renders Reeldesk videos to mp4 and uploads them back to the video.
#
# Started three ways:
#   - Reeldesk: the Render video button and a move to Ready for preview mark a video queued; a
#     nostackai automation then calls this workflow through the GitHub connector's Trigger Workflow
#     action, with the video's id.
#   - The schedule: every 30 minutes, renders any video still queued (a dispatch that never ran).
#   - By hand: Actions → Render video → Run workflow, with or without a video id.
#
# This repository is public, so its run logs are public: the job prints only video ids and
# step names, and every secret is masked by GitHub.
name: Render video

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: Reeldesk video id (leave empty to render every queued video)
        required: false
        type: string
      force:
        description: Render even if another run has claimed the video
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

# One run per video at a time; the queue sweep has its own lane.
concurrency:
  group: render-${{ inputs.video_id || 'queue' }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and a caption font
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Render
        env:
          REELDESK_APP_URL: ${{ secrets.REELDESK_APP_URL }}
          REELDESK_ORG_CODE: ${{ secrets.REELDESK_ORG_CODE }}
          REELDESK_API_KEY: ${{ secrets.REELDESK_API_KEY }}
          REELDESK_CLIENT_ID: ${{ secrets.REELDESK_CLIENT_ID }}
          REELDESK_RENDER_EMAIL: ${{ secrets.REELDESK_RENDER_EMAIL }}
          REELDESK_RENDER_PASSWORD: ${{ secrets.REELDESK_RENDER_PASSWORD }}
          # Inputs go through the environment, never straight into the script, so a crafted id
          # can't inject shell; render_video.py validates the id again before using it.
          VIDEO_ID: ${{ inputs.video_id }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ -n "$VIDEO_ID" ]; then args+=(--video "$VIDEO_ID"); else args+=(--queued); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python render_video.py "${args[@]}"
